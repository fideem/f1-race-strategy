[project]
name = "f1-race-strategy"
version = "0.1.0"
description = "Tyre degradation and pit strategy analysis of the 2025 F1 season using OpenF1 data"
readme = "README.md"
authors = [
    { name = "Milena", email = "stepkowskamilena@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=2.3.3",
    "pyarrow>=18.0",
    "requests>=2.34.2",
    "scikit-learn>=1.6",
]

[project.scripts]
f1-race-strategy = "f1_race_strategy:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.3",
]
